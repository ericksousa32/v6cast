name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Integration tests fail instead of skipping when IPv6 loopback is missing.
      V6CAST_REQUIRE_IPV6: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  hardware-features:
    name: vaapi and pipewire features (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      V6CAST_REQUIRE_IPV6: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system libraries for VA-API and PipeWire
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libva-dev libgbm-dev libdrm-dev libclang-dev clang pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Clippy (vaapi, pipewire)
        run: cargo clippy -p v6cast-media --all-targets --features vaapi,pipewire -- -D warnings

      - name: Test (vaapi, pipewire)
        run: cargo test -p v6cast-media --features vaapi,pipewire
